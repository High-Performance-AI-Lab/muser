[package]
name = "muser-cluster"
description = "Authenticated GX10-to-Mac Handoff V2 transport, replay durability, transfer scheduling, and atomic target-plus-DFlash installation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "muser_cluster"
path = "src/lib.rs"

[features]
# Off by default: a stock `cargo build` must never require MelonDMA's dext
# checkout or a working RDMA NIC. Enable explicitly to build the RDMA
# transport path (see native/melon_rdma/).
melon-rdma = []

[dependencies]
muser-kvpack = { path = "../muser-kvpack" }
muser-engine = { path = "../muser-engine" }
kvpack-handoff = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
libc = "0.2"
ring = "0.17"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
