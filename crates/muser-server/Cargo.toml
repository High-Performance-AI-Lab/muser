[package]
name = "muser-server"
description = "Strict llama/OpenAI/Ollama HTTP serving, authenticated sessions and migration, TLS management, and dashboard telemetry for Muser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["metal"]
metal = ["muser-engine/metal"]
ane-coreml = ["muser-engine/ane-coreml"]
release-real-model = ["muser-engine/release-real-model"]
# Off by default, same as muser-cluster's own feature: a stock `cargo build`
# never requires a MelonDMA checkout or RDMA NIC.
melon-rdma = ["muser-cluster/melon-rdma"]

[[bin]]
name = "muser"
path = "src/main.rs"

[dependencies]
muser-engine = { path = "../muser-engine" }
muser-kvpack = { path = "../muser-kvpack" }
muser-cluster = { path = "../muser-cluster" }
kvpack-handoff = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
chacha20poly1305 = { workspace = true }
base64 = "0.22"
rand = { workspace = true }
minijinja = { version = "=2.12.0", features = ["json"] }
axum = { version = "=0.8.9", features = ["http1", "json", "tokio", "ws"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
tokio = { version = "=1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.17"
tower = { version = "=0.5.2", features = ["limit", "load-shed", "timeout"] }
tower-http = { version = "=0.6.6", features = ["limit", "timeout", "trace"] }
http-body-util = "=0.1.3"
rcgen = { version = "=0.14.9", features = ["x509-parser"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] }

# --- `muser up` one-click launcher (Deliverable A, feat/one-click-deploy) ---
# Scoped to muser-server only: the CLI/orchestrator around the standalone
# Muse engine. See src/up.rs for the entry point.
clap = { version = "4.6", features = ["derive", "env"] }     # arg parsing (muser up / muser serve)
indicatif = "0.18"                                           # real progress bars for the GGUF download
console = "0.15"                                             # terminal styling for the banner (pinned to indicatif's own dep)
ureq = { version = "3", features = ["json", "platform-verifier"] } # decode-migration HTTP client
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] } # streaming HF artifact transport
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] } # bounded response-stream consumption
sha2 = "0.10"                                                # checksum verification
toml = "0.8"                                                 # optional `muser.toml` config file
ctrlc = "3"                                                  # graceful "shutting down" message on Ctrl+C
libc = "0.2"                                                  # advisory topology-operation lock on macOS/Linux

# Axum/Hyper validates HTTP framing and Tokio owns bounded connection and
# body concurrency. Native TLS is provided by rustls through axum-server.
